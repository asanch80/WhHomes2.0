<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHH Landlord Login</title>
    <link rel="stylesheet" href="loginP.css">
</head>
<body>
    <div id="login-container">
        <img src="../Images/whitehat_homes_banner-2.png" alt="WhiteHat Auditors Logo" id="whhlogo" height="150" width="650">
        <div id="navmenu">
            <a href="/index.html" class="nav-button">Home</a> <br>
            <a href="../Disponible/disponible.html" class="nav-button">Espacios Disponibles / Available Spaces</a><br>
            <a href="../Maintenance/maintenanceform.html" class="nav-button">Mantenimiento / Maintenance</a><br>
        </div>
        <h2>Login</h2>
        <form action="dashboard.html" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required><br><br>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required><br><br>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    
</body>
</html>

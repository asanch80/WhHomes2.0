<div id="documents" class="documents"></div>

<script>
  const apiKey = 'AIzaSyAuufyfZE_xPvBzhwNfChcZRXeKIAETzvk';
  const folderId = '1hN-id1oeyEtDzzhxnc1SxOGiaPm71vP0?usp=share_link';

  function listFiles() {
    fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents&key=${apiKey}&fields=files(id,name,mimeType,webViewLink)`)
    .then(response => response.json())
    .then(data => {
      const documentsDiv = document.getElementById('documents');
      data.files.forEach(file => {
        const fileCard = document.createElement('div');
        fileCard.className = 'doc-card';
        fileCard.innerHTML = `
          <h3>${file.name}</h3>
          <a href="${file.webViewLink}" target="_blank" class="doc-button">View Document</a>
        `;
        documentsDiv.appendChild(fileCard);
      });
    })
    .catch(error => console.error('Error fetching files:', error));
  }

  listFiles();
</script>   
</body>
